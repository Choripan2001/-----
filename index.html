<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego Karuta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-principal">
        <div class="panel-superior">
            <div class="controles">
                <select id="selector-audio">
                    <option value="audio1">Pista 1</option>
                    <option value="audio2">Pista 2</option>
                    <option value="audio3">Pista 3</option>
                    <option value="audio4">Pista 4</option>
                </select>
                <button id="btn-mezclar">Mezclar / Reiniciar</button>
                <button id="btn-pausa">Reproducir / Pausar</button>
                <img src="neco-arc.gif" alt="Neco Arc" class="gif-decorativo">
            </div>
            <div class="estadisticas">
                <div id="marcador">Puntuación: 0</div>
                <div id="tiempo-acumulado">Demora: 0.00 s</div>
            </div>
        </div>
        
        <audio id="pista-audio"></audio>
        
        <div id="tablero"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
